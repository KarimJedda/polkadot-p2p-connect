[package]
name = "assethub-balance"
version = "0.1.0"
edition = "2024"

[dependencies]
polkadot-p2p-connect = { path = "../.." }
anyhow = "1"
blake2 = "0.10"
bs58 = "0.5"
ed25519-dalek = "2"
hex = "0.4"
hex-literal = "0.4"
parity-scale-codec = { version = "3", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp-core = "41"
sp-state-machine = "0.51"
sp-trie = "44"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
