[package]
name = "warp-sync"
version = "0.1.0"
edition = "2024"
description = "Trustless GRANDPA warp-sync building blocks for Substrate-based chains."
license = "MIT"

[lib]
# Library API for downstream crates (microdot, app code).
path = "src/lib.rs"

[[bin]]
# Demo binary that warp-syncs Polkadot mainnet over TCP. Gated behind
# the `bin` feature so library consumers don't transitively pull in
# tokio + mio, which don't build for wasm32-unknown-unknown. Build it
# with: `cargo run --features bin` or `cargo build -p warp-sync --bin
# warp-sync --features bin`.
name = "warp-sync"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = []
# Enables the tokio-driven demo binary. Off by default so the lib is
# wasm-clean: bringing tokio in transitively pulls mio, which doesn't
# build for wasm32-unknown-unknown.
bin = ["dep:tokio", "dep:rand", "dep:tracing-subscriber"]

[dependencies]
# `path = "../"` because warp-sync now lives at the workspace root,
# one level above polkadot-p2p-connect's Cargo.toml.
polkadot-p2p-connect = { path = ".." }

parity-scale-codec = { version = "3", features = ["derive"] }
blake2 = "0.10"
hex = "0.4"
hex-literal = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Required by the lib (grandpa.rs uses ed25519 verification + tracing
# log facades). Both are wasm-compatible. `tracing-subscriber` is the
# *initializer* and is binary-only — kept under [features].
ed25519-dalek = "2"
tracing = { version = "0.1", default-features = false }

# Binary-only deps — marked `optional = true` and enabled only by the
# `bin` feature.
tokio = { version = "1", features = ["full"], optional = true }
rand = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
